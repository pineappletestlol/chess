*{box-sizing:border-box;margin:0;padding:0;}

button{background:#1f6f5c;color:#fff;border:none;border-radius:7px;padding:11px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
button:hover{background:#18594a;}
button.secondary{background:#efe9db;color:#22201b;}

.theme-toggle:hover{background:#efe9db;}

.sq.dest::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(20,20,15,0.28);z-index:1;}

<script>
const PIECE_NAMES = {p:"Pawn",n:"Knight",b:"Bishop",r:"Rook",q:"Queen",k:"King"};

const FIGURINE = {
  w: {N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'},
  b: {N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚'}
};
function sanToFigurine(san, color){
  if(!san) return '';
  const map = FIGURINE[color];
  return san
    .replace(/^([NBRQK])/, (m,p)=>map[p]||p)
    .replace(/=([NBRQK])/, (m,p)=>'='+(map[p]||p));
}
function renderMoveLog(moveLog){
  if(!moveLog || !moveLog.length) return '<div class="movelog-wrap empty">No moves yet.</div>';
  let rows = '';
  for(let i=0;i<moveLog.length;i+=2){
    const num = i/2+1;
    const isLastWhite = i===moveLog.length-1;
    const isLastBlack = i+1===moveLog.length-1;
    const whiteSan = sanToFigurine(moveLog[i], 'w');
    const blackSan = moveLog[i+1]!==undefined ? sanToFigurine(moveLog[i+1], 'b') : '';
    rows += `<div class="move-row">` +
      `<span class="move-num">${num}</span>` +
      `<span class="move-white${isLastWhite?' current':''}">${whiteSan}</span>` +
      `<span class="move-black${isLastBlack?' current':''}">${blackSan}</span>` +
    `</div>`;
  }
  return `<div class="movelog-wrap">${rows}</div>`;
}
const PIECE_UNICODE = {
  w:{p:"\u2659",n:"\u2658",b:"\u2657",r:"\u2656",q:"\u2655",k:"\u2654"},
  b:{p:"\u265F",n:"\u265E",b:"\u265D",r:"\u265C",q:"\u265B",k:"\u265A"}
};
// Cburnett piece set (Wikimedia Commons) - the same set Lichess uses by default
function pieceImgUrl(color, type){
  const colorLetter = color==='w' ? 'l' : 'd';
  return `https://commons.wikimedia.org/wiki/Special:FilePath/Chess_${type}${colorLetter}t45.svg`;
}

// ---- sound effects (synthesized, no audio files to host) ----
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, gainStart, delay){
  type = type || 'sine'; gainStart = gainStart===undefined ? 0.15 : gainStart; delay = delay || 0;
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainStart, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.02);
  }catch(e){ /* audio not available - fail silently */ }
}
function playMoveSound(){ beep(520, 0.09, 'sine', 0.2); }
function playCaptureSound(){ beep(240, 0.12, 'square', 0.18); }
function playCheckSound(){ beep(880, 0.09, 'sine', 0.2); beep(660, 0.13, 'sine', 0.2, 0.09); }
function playRandomizeSound(){ beep(420, 0.05, 'sine', 0.14); beep(600, 0.05, 'sine', 0.14, 0.05); beep(820, 0.08, 'sine', 0.16, 0.1); }
function playLowTimeTick(){ beep(1050, 0.06, 'square', 0.15); }
function playGameStartSound(){ beep(440, 0.08, 'sine', 0.16); beep(660, 0.1, 'sine', 0.18, 0.08); }
function playWinSound(){ beep(523, 0.1, 'sine', 0.18); beep(659, 0.1, 'sine', 0.18, 0.1); beep(784, 0.18, 'sine', 0.2, 0.2); }
function playLossSound(){ beep(392, 0.12, 'sine', 0.16); beep(330, 0.16, 'sine', 0.16, 0.11); beep(262, 0.22, 'sine', 0.16, 0.24); }
function playDrawSound(){ beep(440, 0.1, 'sine', 0.15); beep(440, 0.14, 'sine', 0.15, 0.13); }

// Lichess doesn't use a fixed low-time threshold - it scales with the clock (roughly
// 40s for a 5-minute game, 60s for a 10-minute game, based on observed alarm timings).
// Fitting a line through those two points gives threshold ≈ 20 + 6.7% of the starting time.
function lowTimeThresholdMs(clock){
  if(!clock || clock.initialSec<=0) return 0;
  const sec = 20 + clock.initialSec * 0.0667;
  return Math.round(sec) * 1000;
}

function dbPath(key){ return key.replace(/:/g, '/'); }

async function kget(key, shared){
  if(shared === false){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  try{ const snap = await db.ref(dbPath(key)).once('value'); return snap.exists() ? snap.val() : null; }catch(e){ console.error(e); return null; }
}
async function kset(key, value, shared){
  if(shared === false){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; }
  }
  try{ await db.ref(dbPath(key)).set(value); return true; }catch(e){ console.error(e); return false; }
}

function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

let signingUp = false;

auth.onAuthStateChanged(async (user)=>{
  if(signingUp) return; // doSignup drives its own flow while the account is being assembled
  stopPoll();
  if(user){
    await handleSignedIn(user);
  } else {
    ME = null;
    currentGameId = null;
    document.getElementById('userbox').innerHTML = '';
    authMode = 'login';
    renderAuthScreen();
  }
});

async function handleSignedIn(user){
  const username = await kget('hb:usernameByUid:'+user.uid, true);
  if(!username){
    renderAuthScreen('Something went wrong finishing your signup - please try again.');
    return;
  }
  ME = {username};
  const profile = await kget('hb:leaderboard:'+username, true) || {rating:1200, games:0};
  renderUserbox(profile);
  await afterAuth();
}

let authMode = 'login';

function friendlyAuthError(e){
  const code = e && e.code;
  if(code==='auth/email-already-in-use') return 'That email is already registered - try logging in.';
  if(code==='auth/invalid-email') return 'Enter a valid email.';
  if(code==='auth/weak-password') return 'Password needs at least 6 characters.';
  if(code==='auth/user-not-found' || code==='auth/wrong-password' || code==='auth/invalid-credential') return 'Wrong email or password.';
  if(code==='auth/too-many-requests') return 'Too many attempts - try again in a bit.';
  return 'Something went wrong. Please try again.';
}

function renderAuthScreen(err){
  showScreen('auth');
  const el = document.getElementById('screen-auth');
  el.innerHTML = `
    <div class="card">
      <h2>${authMode==='login' ? 'Log in' : 'Create an account'}</h2>
      <p class="desc">${authMode==='login' ? 'Log in with your email.' : 'Pick a username, verify with your email, and you are set.'}</p>
      ${err ? '<div class="draw-offer" style="color:#b8433f;">'+err+'</div>' : ''}
      <div class="row" style="flex-direction:column;align-items:stretch;gap:10px;">
        ${authMode==='signup' ? '<input type="text" id="authUsername" placeholder="username" autocomplete="username">' : ''}
        <input type="email" id="authEmail" placeholder="email" autocomplete="email">
        <input type="password" id="authPassword" placeholder="password" autocomplete="${authMode==='login'?'current-password':'new-password'}">
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button id="btnAuthSubmit">${authMode==='login' ? 'Log in' : 'Sign up'}</button>
        <button class="secondary" id="btnAuthSwitch">${authMode==='login' ? "Need an account? Sign up" : "Have an account? Log in"}</button>
      </div>
    </div>
  `;
  document.getElementById('btnAuthSwitch').onclick = ()=>{ authMode = authMode==='login'?'signup':'login'; renderAuthScreen(); };
  document.getElementById('btnAuthSubmit').onclick = authMode==='login' ? doLogin : doSignup;
  el.querySelectorAll('input').forEach(inp=>{
    inp.onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('btnAuthSubmit').click(); };
  });

async function doSignup(){
  const username = document.getElementById('authUsername').value.trim();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!username || !email || !password){ renderAuthScreen('Fill in all fields.'); return; }
  if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){ renderAuthScreen('Username: 3-20 letters, numbers or underscores.'); return; }
  if(password.length < 6){ renderAuthScreen('Password needs at least 6 characters.'); return; }

  const taken = await kget('hb:account:'+username+':uid', true);
  if(taken){ renderAuthScreen('That username is taken.'); return; }

  signingUp = true;
  let cred;
  try{
    cred = await auth.createUserWithEmailAndPassword(email, password);
  } catch(e){
    signingUp = false;
    renderAuthScreen(friendlyAuthError(e));
    return;
  }
  const uid = cred.user.uid;
  const claimed = await kset('hb:account:'+username, {uid}, true);
  if(!claimed){
    // Someone else grabbed the username in the split second between our check and this write.
    try{ await cred.user.delete(); }catch(e){}
    signingUp = false;
    await auth.signOut().catch(()=>{});
    renderAuthScreen('That username is taken.');
    return;
  }
  await kset('hb:usernameByUid:'+uid, username, true);
  const profile = {rating:1200, games:0};
  await kset('hb:leaderboard:'+username, profile, true);
  ME = {username};
  renderUserbox(profile);
  signingUp = false;
  await afterAuth();
}

async function doLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ renderAuthScreen('Fill in all fields.'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged -> handleSignedIn takes it from here.
  } catch(e){
    renderAuthScreen(friendlyAuthError(e));
  }
}

function expectedScore(ra, rb){ return 1/(1+Math.pow(10,(rb-ra)/400)); }

function computeEloChange(myRating, oppRating, myScore){
  const K = 32;
  const expected = expectedScore(myRating, oppRating);
  return Math.round(myRating + K*(myScore - expected)) - myRating;
}

function scoreForSide(winner, side){
  if(winner==='draw') return 0.5;
  return winner===side ? 1 : 0;
}

// Each client applies ONLY its own rating change - the leaderboard write rule only
// allows a user to write their own entry.
let myRatingChangeCache = {};
const settlingGames = {};

async function settleMyRating(g){
  if(!g || g.mode!=='random' || g.status!=='finished' || !g.ratingSnapshot) return;
  const gid = currentGameId; // captured now: currentGameId may change (rematch) while we await
  const me = myRole(g);
  if(!me) return;
  const side = me.side;
  if(myRatingChangeCache[gid] || settlingGames[gid]) return;
  if(g.ratingApplied && g.ratingApplied[side]) return;
  settlingGames[gid] = true;
  const myStart = side==='w' ? g.ratingSnapshot.white : g.ratingSnapshot.black;
  const oppStart = side==='w' ? g.ratingSnapshot.black : g.ratingSnapshot.white;
  const myScore = scoreForSide(g.winner, side);
  const change = computeEloChange(myStart, oppStart, myScore);
  const myUsername = ME.username;
  const myProfile = await kget('hb:leaderboard:'+myUsername, true) || {rating:myStart, games:0};
  const newRating = myProfile.rating + change;
  myRatingChangeCache[gid] = {change, newRating};
  await kset('hb:leaderboard:'+myUsername, {rating:newRating, games:myProfile.games+1}, true);
  await db.ref(dbPath('hb:game:'+gid+'/ratingApplied/'+side)).set(true);
  if(gameState && currentGameId===gid) drawGame();
}

function startClock(game){
  if(game.clock && game.clock.initialSec>0) game.clock.turnStartedAt = serverNow();
}

function freshClock(tcKey){
  const tc = getTC(tcKey);
  return {initialSec: tc.initial, incrementSec: tc.increment, tcKey: tc.key, whiteMs: tc.initial*1000, blackMs: tc.initial*1000, turnStartedAt: 0};
}

async function createRoom(){
  const code = genCode();
  const game = {
    mode: createMode,
    status: 'waiting',
    fen: new Chess().fen(),
    turn: 'w',
    announced: null,
    moveLog: [],
    winner: null,
    drawOffer: "",
    clock: freshClock(selectedTC),
    seats: createMode==='team'
      ? {whiteBrain:"", whiteHand:"", blackBrain:"", blackHand:""}
      : {white:"", black:""}
  };
  await kset('hb:game:'+code, game, true);
  currentGameId = code;
  renderWaiting(code);
}

async function joinRoom(code){
  const game = await kget('hb:game:'+code, true);
  if(!game){ alert('No room with that code.'); return; }
  currentGameId = code;
  if(game.status==='active'){ enterGameScreen(code); return; }
  renderWaiting(code);
}

function allSeatsFilled(game){
  return Object.values(game.seats).every(v => !!v);
}

async function takeSeat(code, seatKey){
  const game = await kget('hb:game:'+code, true);
  if(!game || game.status==='active') return;
  if(game.seats[seatKey]) return;
  Object.keys(game.seats).forEach(k=>{ if(game.seats[k]===ME.username) game.seats[k]=""; });
  game.seats[seatKey] = ME.username;
  if(allSeatsFilled(game)){
    game.status = 'active';
    if(game.mode==='random'){
      const wp = await kget('hb:leaderboard:'+game.seats.white, true) || {rating:1200, games:0};
      const bp = await kget('hb:leaderboard:'+game.seats.black, true) || {rating:1200, games:0};
      game.ratingSnapshot = {white:wp.rating, black:bp.rating};
    }
  }
  await kset('hb:game:'+code, game, true);
}

async function leaveSeatOnly(code, seatKey){
  const game = await kget('hb:game:'+code, true);
  if(!game || game.status==='active') return;
  if(game.seats[seatKey]===ME.username) game.seats[seatKey]="";
  await kset('hb:game:'+code, game, true);
  drawWaiting(code, game);
}

async function quickMatch(){
  document.getElementById('quickHint').innerHTML = 'Searching... <span class="backlink" id="btnCancelQuick">cancel</span>';
  document.getElementById('btnCancelQuick').onclick = cancelQuickMatch;
  document.getElementById('btnQuick').disabled = true;
  const queueSnap = await db.ref('hb/queue/random').once('value');
  const queueObj = queueSnap.exists() ? queueSnap.val() : {};
  const now = serverNow();
  const candidate = Object.keys(queueObj).find(u => u!==ME.username && !queueObj[u].gameId && queueObj[u].tc===selectedTC && (now-queueObj[u].joinedAt)<60000);
  if(candidate){
    const code = genCode();
    const iAmWhite = Math.random() < 0.5;
    const clock = freshClock(selectedTC);
    const myProfile = await kget('hb:leaderboard:'+ME.username, true) || {rating:1200, games:0};
    const oppProfile = await kget('hb:leaderboard:'+candidate, true) || {rating:1200, games:0};
    const game = {
      mode:'random', status:'active', fen:new Chess().fen(), turn:'w', announced:null,
      moveLog:[], winner:null, drawOffer:"", clock:clock,
      seats: iAmWhite ? {white:ME.username, black:candidate} : {white:candidate, black:ME.username},
      ratingSnapshot: iAmWhite ? {white:myProfile.rating, black:oppProfile.rating} : {white:oppProfile.rating, black:myProfile.rating}
    };
    await kset('hb:game:'+code, game, true);
    await db.ref('hb/queue/random/'+candidate+'/gameId').set(code);
    await db.ref('hb/queue/random/'+ME.username).remove();
    currentGameId = code;
    enterGameScreen(code);
  } else {
    await db.ref('hb/queue/random/'+ME.username).set({joinedAt: now, gameId: "", tc: selectedTC});
    activeListenerRef = db.ref('hb/queue/random/'+ME.username+'/gameId');
    activeListenerRef.on('value', snap=>{
      const gid = snap.val();
      if(gid){
        stopPoll();
        db.ref('hb/queue/random/'+ME.username).remove();
        currentGameId = gid;
        enterGameScreen(gid);
      }
    });
  }
}

async function cancelQuickMatch(){
  stopPoll();
  await db.ref('hb/queue/random/'+ME.username).remove();
  renderLobby();
}

// ================= WAITING ROOM =================
function renderWaiting(code){
  showScreen('waiting');
  stopPoll();
  kset('hb:lastgame', {gameId: code, savedAt: Date.now()}, false);
  activeListenerRef = db.ref(dbPath('hb:game:'+code));
  activeListenerRef.on('value', snap=>{
    const game = snap.exists() ? snap.val() : null;
    if(!game) return;
    if(game.status==='active'){ stopPoll(); enterGameScreen(code); return; }
    drawWaiting(code, game);
  });
}

function seatLabel(mode, key){
  if(mode==='team'){
    const map = {whiteBrain:'White - Brain', whiteHand:'White - Hand', blackBrain:'Black - Brain', blackHand:'Black - Hand'};
    return map[key];
  }
  return key==='white' ? 'White' : 'Black';
}

function drawWaiting(code, game){
  const el = document.getElementById('screen-waiting');
  const seatKeys = Object.keys(game.seats);
  const rows = seatKeys.map(k=>{
    const occ = game.seats[k];
    if(occ===ME.username){
      return `<div class="seat"><span class="taken">${seatLabel(game.mode,k)} (you)</span><span class="backlink" data-leave="${k}">leave</span></div>`;
    } else if(occ){
      return `<div class="seat"><span class="who">${seatLabel(game.mode,k)}</span><span class="taken">${occ}</span></div>`;
    } else {
      return `<div class="seat"><span class="who">${seatLabel(game.mode,k)}</span><button class="secondary" data-take="${k}">Take seat</button></div>`;
    }
  }).join('');
  el.innerHTML = `
    <div class="card">
      <h2>Waiting for players</h2>
      <p class="desc">Share this code with your ${game.mode==='team'?'3 friends':'friend'}. Pick your seat below - the game starts once every seat is filled.</p>
      <div class="code-display">${code}</div>
      ${rows}
      <div style="margin-top:12px;"><span class="backlink" id="btnLeave">Leave room</span></div>
    </div>
  `;
  el.querySelectorAll('[data-take]').forEach(b=> b.onclick = ()=> takeSeat(code, b.dataset.take));
  el.querySelectorAll('[data-leave]').forEach(b=> b.onclick = ()=> leaveSeatOnly(code, b.dataset.leave));
  document.getElementById('btnLeave').onclick = ()=>{ stopPoll(); clearLastGame(); renderLobby(); };
}

// ================= GAME =================
let gameState = null;
let flipped = false;
let clockTickTimer = null;
let lastSeenMoveCount = null; // null = "just loaded, don't play a move sound for history"
let tickGameTurnKey = null;   // resets the low-time beep counter whenever the turn (or game) changes
let tickLastSecond = null;
let endSoundPlayed = false;   // guards against replaying win/loss/draw on every later snapshot

function enterGameScreen(code){
  currentGameId = code;
  showScreen('game');
  selectedSquare = null;
  stopPoll();
  kset('hb:lastgame', {gameId: code, savedAt: Date.now()}, false);
  gameState = null;
  selectedSquare = null;
  pendingPromotion = null;
  lastSeenMoveCount = null;
  tickGameTurnKey = null;
  tickLastSecond = null;
  endSoundPlayed = false;
  activeListenerRef = db.ref(dbPath('hb:game:'+code));
  activeListenerRef.on('value', snap=>{
    const g = snap.exists() ? snap.val() : null;
    if(!g) return;
    // Rematch accepted: settle the rating of the game just finished, then jump to the new game.
    if(g.status==='finished' && g.rematchGameId && myRole(g)){
      settleMyRating(g);
      enterGameScreen(g.rematchGameId);
      return;
    }
    gameState = g;
    const me = myRole(g);
    flipped = me && me.side==='b';
    // Play a sound for any move that just landed - works for both the mover and the
    // opponent/spectators, since it's driven off the synced state, not the local click.
    const moveCount = g.moveLog ? g.moveLog.length : 0;
    if(lastSeenMoveCount === null){
      // First snapshot of this session - a freshly-active, moveless game means we just
      // walked in as it started (quick match found, or the last friend took their seat).
      if(g.status==='active' && moveCount===0) playGameStartSound();
    } else if(moveCount > lastSeenMoveCount){
      const lastSan = g.moveLog[moveCount-1];
      if(lastSan.includes('+') || lastSan.includes('#')) playCheckSound();
      else if(lastSan.includes('x')) playCaptureSound();
      else playMoveSound();
    }
    lastSeenMoveCount = moveCount;
    if(g.status==='finished' && !endSoundPlayed){
      endSoundPlayed = true;
      if(me){
        if(g.winner==='draw') playDrawSound();
        else if(g.winner===me.side) playWinSound();
        else playLossSound();
      }
    }
    drawGame();
    if(g.status==='finished' && g.mode==='random'){ settleMyRating(g); }
  });
  clockTickTimer = setInterval(clockTick, 500);
}

function clearLastGame(){
  kset('hb:lastgame', null, false);
}

// Remaining ms for a side, using server time so both players see the same clock.
function clockMs(g, side){
  const base = side==='w' ? g.clock.whiteMs : g.clock.blackMs;
  if(g.status==='active' && g.turn===side && g.clock.turnStartedAt) return base - (serverNow() - g.clock.turnStartedAt);
  return base;
}

async function clockTick(){
  const g = gameState;
  if(!g || g.status!=='active' || !g.clock || g.clock.initialSec<=0 || !g.clock.turnStartedAt){ drawClocksOnly(); return; }

  // Low-time tick: one beep per whole second while the side to move is under the
  // adaptive threshold for this time control. Resets whenever the turn (or the
  // game) changes, so it can't carry over incorrectly.
  const turnKey = currentGameId + ':' + g.turn;
  if(turnKey !== tickGameTurnKey){ tickGameTurnKey = turnKey; tickLastSecond = null; }
  const remaining = clockMs(g, g.turn);
  const threshold = lowTimeThresholdMs(g.clock);
  if(threshold > 0 && remaining > 0 && remaining <= threshold){
    const sec = Math.ceil(remaining/1000);
    if(sec !== tickLastSecond){ tickLastSecond = sec; playLowTimeTick(); }
  }

  if(clockMs(g, g.turn) <= 0){
    const gid = currentGameId;
    const fresh = await kget('hb:game:'+gid, true);
    if(fresh && fresh.status==='active' && clockMs(fresh, fresh.turn) <= 0){
      const loser = fresh.turn;
      // FIDE 6.9: if the flag falls and the opponent has no way to checkmate with
      // any sequence of legal moves, the game is a draw rather than a loss.
      const chessNow = new Chess(fresh.fen);
      const isDraw = chessNow.insufficient_material();
      await db.ref(dbPath('hb:game:'+gid)).update({
        status:'finished',
        winner: isDraw ? 'draw' : (loser==='w'?'b':'w'),
        statusNote: isDraw ? 'draw - insufficient material on time' : 'won on time',
        [loser==='w' ? 'clock/whiteMs' : 'clock/blackMs']: 0,
        'clock/turnStartedAt': 0
      });
    }
    return;
  }
  drawClocksOnly();
}

function fmtClock(ms){
  ms = Math.max(0, ms);
  const totalSec = Math.ceil(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m+':'+String(s).padStart(2,'0');
}

function drawClocksOnly(){
  const g = gameState;
  if(!g || !g.clock || g.clock.initialSec<=0) return;
  const wEl = document.getElementById('clockWhite');
  const bEl = document.getElementById('clockBlack');
  if(wEl) wEl.textContent = fmtClock(clockMs(g,'w'));
  if(bEl) bEl.textContent = fmtClock(clockMs(g,'b'));
}

async function refreshGame(){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g) return;
  gameState = g;
  const me = myRole(g);
  flipped = me && me.side==='b';
  drawGame();
}

function myRole(g){
  if(g.mode==='team'){
    if(g.seats.whiteBrain===ME.username) return {side:'w', role:'brain'};
    if(g.seats.whiteHand===ME.username) return {side:'w', role:'hand'};
    if(g.seats.blackBrain===ME.username) return {side:'b', role:'brain'};
    if(g.seats.blackHand===ME.username) return {side:'b', role:'hand'};
  } else {
    if(g.seats.white===ME.username) return {side:'w', role:'solo'};
    if(g.seats.black===ME.username) return {side:'b', role:'solo'};
  }
  return null;
}

function legalTypesNow(chess){
  const moves = chess.moves({verbose:true});
  return [...new Set(moves.map(m=>m.piece))];
}

function allowedFromSquares(chess, announced){
  if(!announced) return [];
  return chess.moves({verbose:true}).filter(m=>m.piece===announced);
}

function drawGame(){
  const g = gameState;
  const chess = new Chess(g.fen);
  const me = myRole(g);
  const mySide = me ? me.side : null;
  const myTurn = mySide === g.turn;
  const el = document.getElementById('screen-game');

  const board = chess.board();
  const rowsOrder = flipped ? [0,1,2,3,4,5,6,7].reverse() : [0,1,2,3,4,5,6,7];
  const colsOrder = flipped ? [0,1,2,3,4,5,6,7].reverse() : [0,1,2,3,4,5,6,7];

  const allowed = allowedFromSquares(chess, g.announced);
  const fromSquares = new Set(allowed.map(m=>m.from));
  const destMoves = selectedSquare ? allowed.filter(m=>m.from===selectedSquare) : [];
  const destSquares = new Set(destMoves.map(m=>m.to));
  const captureSquares = new Set(destMoves.filter(m=>m.captured).map(m=>m.to));

  const canInteract = myTurn && (
    (g.mode==='team' && me.role==='hand' && g.announced) ||
    (g.mode==='random' && me.role==='solo' && g.announced)
  );

  const hasClock = g.clock && g.clock.initialSec>0;
  const topColor = flipped ? 'w' : 'b';
  const botColor = flipped ? 'b' : 'w';
  const clockBox = (color)=>`
      <div class="clock ${g.status==='active' && g.turn===color?'active':''}"><span class="label">${color==='w'?'White':'Black'}</span><span id="clock${color==='w'?'White':'Black'}">${fmtClock(clockMs(g,color))}</span></div>
    `;
  const clockHtml = hasClock ? clockBox(topColor) : '';
  const clockHtmlBottom = hasClock ? clockBox(botColor) : '';

  let checkedKingSquare = null;
  if(chess.in_check()){
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p = board[r][c];
        if(p && p.type==='k' && p.color===chess.turn()){ checkedKingSquare = "abcdefgh"[c]+(8-r); }
      }
    }
  }

  let boardHtml = '<div>';
  boardHtml += clockHtml;
  boardHtml += '<div class="board">';
  for(const r of rowsOrder){
    for(const c of colsOrder){
      const file = "abcdefgh"[c];
      const rank = 8-r;
      const sq = file+rank;
      const piece = board[r][c];
      const isLight = (r+c)%2===0;
      let cls = 'sq ' + (isLight?'light':'dark');
      if(g.lastMove && (sq===g.lastMove.from || sq===g.lastMove.to)) cls += ' last';
      if(sq===selectedSquare) cls += ' from';
      if(sq===checkedKingSquare) cls += ' in-check';
      if(canInteract && destSquares.has(sq)){ cls += ' dest'; if(captureSquares.has(sq)) cls += ' capture'; }
      let symbol = '';
      if(piece){
        const unicodeFallback = PIECE_UNICODE[piece.color][piece.type];
        symbol = `<img class="piece-img" src="${pieceImgUrl(piece.color, piece.type)}" alt="" draggable="false" onerror="this.outerHTML='<span style=&quot;font-size:1em;line-height:1;&quot;>${unicodeFallback}</span>'">`;
      }
      let coordHtml = '';
      if(c===colsOrder[0]) coordHtml += `<span class="coord rank">${rank}</span>`;
      if(r===rowsOrder[rowsOrder.length-1]) coordHtml += `<span class="coord file">${file}</span>`;
      boardHtml += `<div class="${cls}" data-sq="${sq}">${coordHtml}${symbol}</div>`;
    }
  }
  boardHtml += '</div>';
  boardHtml += clockHtmlBottom;
  boardHtml += '</div>';

  let panelHtml = '';
  if(g.status==='finished'){
    let resultText = g.winner==='draw' ? 'Draw' : (g.winner==='w'?'White wins':'Black wins');
    let extra = '';
    if(g.statusNote) extra += '<div class="rc">'+g.statusNote+'</div>';
    if(g.mode==='random'){
      const rc = myRatingChangeCache[currentGameId];
      if(rc) extra += `<div class="rc">You: ${rc.change>=0?'+':''}${rc.change} (now ${rc.newRating})</div>`;
      else if(myRole(g)) extra += '<div class="rc">Updating rating...</div>';
    }
    panelHtml += `<div class="result-banner">${resultText}${extra}</div>`;
    if(me){
      if(g.rematchOffer==='declined'){
        panelHtml += '<div class="status-msg">Rematch declined.</div>';
      } else if(g.rematchOffer && g.rematchOffer!==mySide){
        panelHtml += `<div class="draw-offer">Your opponent wants a rematch.<div class="draw-offer-btns"><button id="btnAcceptRematch">Accept</button><button class="secondary" id="btnDeclineRematch">Decline</button></div></div>`;
      } else if(g.rematchOffer===mySide){
        panelHtml += '<div class="status-msg">Rematch offer sent - waiting for a response.</div>';
      } else {
        panelHtml += '<button class="full-btn" id="btnRematch">Rematch</button>';
      }
    }
    panelHtml += '<button class="secondary full-btn" id="btnBack">Back to lobby</button>';
  } else if(pendingPromotion){
    const promoNames = {q:'Queen', r:'Rook', b:'Bishop', n:'Knight'};
    panelHtml += `<div class="hint" style="margin-bottom:10px;">Promote to:</div>`;
    panelHtml += '<div class="types">' + Object.keys(promoNames).map(p=>
      `<button data-promo="${p}">${promoNames[p]}</button>`
    ).join('') + '</div>';
    panelHtml += `<button class="secondary" id="btnCancelPromo" style="margin-top:10px;">Cancel</button>`;
  } else {
    const legalTypes = legalTypesNow(chess);
    panelHtml += `<div class="announce ${g.announced?'':'empty'}">${g.announced ? 'Announced: '+PIECE_NAMES[g.announced] : 'No piece announced yet'}</div>`;
    if(!myTurn){
      panelHtml += `<div class="status-msg">Waiting on the other side...</div>`;
    } else if(g.mode==='team'){
      if(me.role==='brain' && !g.announced){
        panelHtml += '<div class="types">' + Object.keys(PIECE_NAMES).map(p=>{
          const ok = legalTypes.includes(p);
          return `<button data-type="${p}" ${ok?'':'disabled'}>${PIECE_NAMES[p]}</button>`;
        }).join('') + '</div>';
        panelHtml += `<div class="hint">Only pieces with a legal move can be announced.</div>`;
      } else if(me.role==='brain' && g.announced){
        panelHtml += `<div class="status-msg">Waiting for your Hand to move...</div>`;
      } else if(me.role==='hand' && !g.announced){
        panelHtml += `<div class="status-msg">Waiting for your Brain to announce a piece...</div>`;
      } else if(me.role==='hand' && g.announced){
        panelHtml += `<div class="status-msg">Click a highlighted piece, then a highlighted square.</div>`;
      }
    } else if(g.mode==='random'){
      if(me.role==='solo' && !g.announced){
        panelHtml += '<button id="btnRandomize">Randomize piece</button>';
        panelHtml += `<div class="hint">Only picks from pieces that currently have a legal move.</div>`;
      } else if(me.role==='solo' && g.announced){
        panelHtml += `<div class="status-msg">Click a highlighted piece, then a highlighted square.</div>`;
      }
    }
    if(!me){
      panelHtml += `<div class="status-msg">You are spectating this game.</div>`;
    }

    if(me){
      if(g.drawOffer && g.drawOffer!==mySide){
        panelHtml += `<div class="draw-offer">Your opponent offers a draw.<div class="draw-offer-btns"><button id="btnAcceptDraw">Accept</button><button class="secondary" id="btnDeclineDraw">Decline</button></div></div>`;
      } else if(g.drawOffer && g.drawOffer===mySide){
        panelHtml += `<div class="status-msg">Draw offer sent - waiting for a response.</div>`;
      }
      panelHtml += `<div class="game-actions">`;
      if(!(g.drawOffer && g.drawOffer===mySide)){
        panelHtml += `<button class="secondary" id="btnOfferDraw">Offer draw</button>`;
      }
      panelHtml += `<button class="secondary danger" id="btnResign">Resign</button>`;
      panelHtml += `</div>`;
    }
  }

  panelHtml += renderMoveLog(g.moveLog);

  el.innerHTML = `
    <div class="card">
      <div class="board-wrap">
        ${boardHtml}
        <div class="panel">${panelHtml}</div>
      </div>
    </div>
  `;

  if(g.status!=='finished'){
    el.querySelectorAll('[data-type]:not([disabled])').forEach(btn=>{
      btn.onclick = ()=> announceType(btn.dataset.type);
    });
    const rb = document.getElementById('btnRandomize');
    if(rb) rb.onclick = randomizeType;
    const resignBtn = document.getElementById('btnResign');
    if(resignBtn) resignBtn.onclick = ()=>{ if(confirm('Resign this game?')) resignGame(mySide); };
    const offerBtn = document.getElementById('btnOfferDraw');
    if(offerBtn) offerBtn.onclick = ()=> offerDraw(mySide);
    const acceptBtn = document.getElementById('btnAcceptDraw');
    if(acceptBtn) acceptBtn.onclick = acceptDraw;
    const declineBtn = document.getElementById('btnDeclineDraw');
    if(declineBtn) declineBtn.onclick = declineDraw;
    el.querySelectorAll('[data-promo]').forEach(btn=>{
      btn.onclick = ()=>{
        const pp = pendingPromotion;
        pendingPromotion = null;
        selectedSquare = null;
        if(pp) makeMove(pp.from, pp.to, btn.dataset.promo);
      };
    });
    const cancelPromoBtn = document.getElementById('btnCancelPromo');
    if(cancelPromoBtn) cancelPromoBtn.onclick = ()=>{ pendingPromotion = null; selectedSquare = null; drawGame(); };
    if(canInteract && !pendingPromotion){
      el.querySelectorAll('[data-sq]').forEach(cell=>{
        cell.onclick = ()=> handleSquareClick(cell.dataset.sq, fromSquares, destSquares, destMoves);
      });
    }
  } else {
    const bb = document.getElementById('btnBack');
    if(bb) bb.onclick = ()=>{ stopPoll(); clearLastGame(); renderLobby(); };
    const rmBtn = document.getElementById('btnRematch');
    if(rmBtn) rmBtn.onclick = ()=> offerRematch(mySide);
    const rmAcc = document.getElementById('btnAcceptRematch');
    if(rmAcc) rmAcc.onclick = acceptRematch;
    const rmDec = document.getElementById('btnDeclineRematch');
    if(rmDec) rmDec.onclick = declineRematch;
  }
}

async function announceType(type){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.announced) return;
  g.announced = type;
  await kset('hb:game:'+currentGameId, g, true);
  refreshGame();
}

async function randomizeType(){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.announced) return;
  const chess = new Chess(g.fen);
  const moves = chess.moves({verbose:true});
  if(moves.length===0) return;
  // Weighted by move count per type - a rook with one legal move shouldn't be
  // as likely to get picked as a pawn with eight.
  const type = moves[Math.floor(Math.random()*moves.length)].piece;
  playRandomizeSound();
  await announceType(type);
}

function handleSquareClick(sq, fromSquares, destSquares, destMoves){
  if(pendingPromotion) return;
  if(!selectedSquare){
    if(fromSquares.has(sq)){ selectedSquare = sq; drawGame(); }
  } else {
    if(destSquares.has(sq)){
      const promo = destMoves.find(m=>m.to===sq && m.promotion);
      if(promo){
        pendingPromotion = {from:selectedSquare, to:sq, color:promo.color};
        drawGame();
      } else {
        makeMove(selectedSquare, sq);
        selectedSquare = null;
      }
    } else if(fromSquares.has(sq)){
      selectedSquare = sq; drawGame();
    } else {
      selectedSquare = null; drawGame();
    }
  }
}

async function finishGame(g, winner, note){
  g.status = 'finished';
  g.winner = winner;
  g.statusNote = note;
  await kset('hb:game:'+currentGameId, g, true);
}

async function resignGame(mySide){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.status!=='active' || !mySide) return;
  await finishGame(g, mySide==='w' ? 'b' : 'w', 'resigned');
}

async function offerDraw(mySide){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.status!=='active' || !mySide) return;
  g.drawOffer = mySide;
  await kset('hb:game:'+currentGameId, g, true);
}

async function acceptDraw(){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.status!=='active' || !g.drawOffer) return;
  await finishGame(g, 'draw', 'draw agreed');
}

async function declineDraw(){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.status!=='active') return;
  g.drawOffer = "";
  await kset('hb:game:'+currentGameId, g, true);
}

async function makeMove(from, to, promotion){
  const g = await kget('hb:game:'+currentGameId, true);
  if(!g || g.status!=='active') return;
  const chess = new Chess(g.fen);
  const moverColor = chess.turn();

  // If the mover's time already ran out, the move doesn't count - they lose on time
  // (or draw, per FIDE 6.9, if the opponent has insufficient mating material).
  if(g.clock && g.clock.initialSec>0 && g.clock.turnStartedAt){
    const mine = moverColor==='w' ? g.clock.whiteMs : g.clock.blackMs;
    if(serverNow() - g.clock.turnStartedAt >= mine){
      const isDraw = chess.insufficient_material();
      g.status = 'finished';
      g.winner = isDraw ? 'draw' : (moverColor==='w' ? 'b' : 'w');
      g.statusNote = isDraw ? 'draw - insufficient material on time' : 'won on time';
      if(moverColor==='w') g.clock.whiteMs = 0; else g.clock.blackMs = 0;
      g.clock.turnStartedAt = 0;
      await kset('hb:game:'+currentGameId, g, true);
      return;
    }
  }

  const mv = chess.move({from, to, promotion: promotion || 'q'});
  if(!mv) return;
  g.fen = chess.fen();
  g.turn = chess.turn();
  g.announced = null;
  g.drawOffer = "";
  g.lastMove = {from: mv.from, to: mv.to};
  g.moveLog = g.moveLog || [];
  g.moveLog.push(mv.san);

  // Deduct the time used this turn, then add the increment (every move, including the first).
  if(g.clock && g.clock.initialSec>0){
    const now = serverNow();
    const elapsed = g.clock.turnStartedAt ? now - g.clock.turnStartedAt : 0;
    const incMs = (g.clock.incrementSec||0)*1000;
    if(moverColor==='w') g.clock.whiteMs = Math.max(0, g.clock.whiteMs - elapsed) + incMs;
    else g.clock.blackMs = Math.max(0, g.clock.blackMs - elapsed) + incMs;
    g.clock.turnStartedAt = now;
  }

  // FIDE 9.2: threefold repetition. chess.js only tracks repetition for moves it played
  // itself, so replay the whole game on a fresh instance. Nothing extra is stored in the DB.
  let repetition = false;
  try{
    const replay = new Chess();
    for(const san of g.moveLog) replay.move(san);
    repetition = replay.in_threefold_repetition();
  }catch(e){ console.error('repetition check failed', e); }

  if(chess.game_over()){
    g.status = 'finished';
    if(chess.in_checkmate()){
      g.winner = mv.color;
    } else {
      g.winner = 'draw';
      g.statusNote = chess.in_stalemate() ? 'draw - stalemate'
        : chess.insufficient_material() ? 'draw - insufficient material'
        : 'draw - 50-move rule';
    }
  } else if(repetition){
    g.status = 'finished';
    g.winner = 'draw';
    g.statusNote = 'draw - threefold repetition';
  }

  const saved = await kset('hb:game:'+currentGameId, g, true);
  if(!saved){ alert("Your move couldn't be saved to the server. Check your connection / Firebase rules (see browser console)."); return; }
  refreshGame();
}

// ================= REMATCH =================
async function offerRematch(mySide){
  const gid = currentGameId;
  const g = await kget('hb:game:'+gid, true);
  if(!g || g.status!=='finished' || g.rematchGameId || !mySide) return;
  // If the opponent already asked, clicking Rematch just accepts.
  if(g.rematchOffer && g.rematchOffer!==mySide && g.rematchOffer!=='declined'){ await acceptRematch(); return; }
  await db.ref(dbPath('hb:game:'+gid+'/rematchOffer')).set(mySide);
}

async function declineRematch(){
  await db.ref(dbPath('hb:game:'+currentGameId+'/rematchOffer')).set('declined');
}

async function acceptRematch(){
  const gid = currentGameId;
  const g = await kget('hb:game:'+gid, true);
  if(!g || g.status!=='finished' || g.rematchGameId || !myRole(g)) return;
  const s = g.seats;
  const c = g.clock || {initialSec:0, incrementSec:0};
  // Colors swap for the rematch.
  const seats = g.mode==='team'
    ? {whiteBrain:s.blackBrain, whiteHand:s.blackHand, blackBrain:s.whiteBrain, blackHand:s.whiteHand}
    : {white:s.black, black:s.white};
  const game = {
    mode:g.mode, status:'active', fen:new Chess().fen(), turn:'w', announced:null,
    moveLog:[], winner:null, drawOffer:"", seats,
    clock:{initialSec:c.initialSec, incrementSec:c.incrementSec, whiteMs:c.initialSec*1000, blackMs:c.initialSec*1000, turnStartedAt:0}
  };
  if(g.mode==='random'){
    const snap = g.ratingSnapshot;
    let wR, bR;
    if(snap && g.winner){
      // Ratings after the game just played (same Elo math each client applies to itself).
      bR = snap.white + computeEloChange(snap.white, snap.black, scoreForSide(g.winner,'w')); // old white -> new black
      wR = snap.black + computeEloChange(snap.black, snap.white, scoreForSide(g.winner,'b')); // old black -> new white
    } else {
      const wp = await kget('hb:leaderboard:'+seats.white, true) || {rating:1200};
      const bp = await kget('hb:leaderboard:'+seats.black, true) || {rating:1200};
      wR = wp.rating; bR = bp.rating;
    }
    game.ratingSnapshot = {white:wR, black:bR};
  }
  const code = genCode();
  await kset('hb:game:'+code, game, true);
  // Both players' listeners on the old game see this and move to the new one.
  await db.ref(dbPath('hb:game:'+gid+'/rematchGameId')).set(code);
}

// ================= INIT =================
// Startup is driven by auth.onAuthStateChanged (registered above), which calls
// handleSignedIn() -> afterAuth() once Firebase Auth reports who's logged in.

async function afterAuth(){
  const last = await kget('hb:lastgame', false);
  if(last && last.gameId && (Date.now()-last.savedAt) < 12*60*60*1000){
    const g = await kget('hb:game:'+last.gameId, true);
    if(g && g.status==='active' && myRoleForUser(g, ME.username)){
      currentGameId = last.gameId;
      enterGameScreen(last.gameId);
      return;
    } else if(g && g.status==='waiting'){
      currentGameId = last.gameId;
      renderWaiting(last.gameId);
      return;
    } else {
      clearLastGame();
    }
  }
  renderLobby();
}

function myRoleForUser(g, username){
  if(g.mode==='team'){
    return Object.values(g.seats).includes(username);
  }
  return g.seats.white===username || g.seats.black===username;
}

<!-- ===== PAWNIAC STEP 3 v4: KNIGHT'S TOUR, EVERY RUN COUNTS (replaces the v3 block) ===== -->
<style>
/* nav bar follows light / dark theme */
.navbar{background:#fffdf9;border:1px solid #e4ddcf;}
.navbar a{color:#7a766c;}
.navbar a:hover{color:#22201b;}

/* knight's tour */
.sq.visited-n{font-weight:700;font-size:calc(var(--sq) * 0.28);color:rgba(20,20,15,.65);}
.kt-knight{font-size:calc(var(--sq) * 0.72);line-height:1;color:#141210;text-shadow:0 0 3px #f7f2e4,0 0 3px #f7f2e4;}
.kt-time{font-family:monospace;font-size:26px;font-weight:700;text-align:center;margin-bottom:12px;}
</style>
<script>
(function(){
  var kt = {path:[], start:0, ms:0, done:false, over:false, timer:null, best:null, msg:''};
  var KN = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(ms){
    var tenths = Math.floor(ms / 100);
    var m = Math.floor(tenths / 600);
    var s = (tenths % 600) / 10;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  // a run beats another if it covers more squares, or the same squares faster
  function better(a, b){
    return !b || a.sq > b.sq || (a.sq === b.sq && a.ms < b.ms);
  }
  function fmtBest(b){ return b ? b.sq + '/64 in ' + fmt(b.ms) : 'none yet'; }
  function visited(f, r){
    return kt.path.some(function(p){ return p[0]===f && p[1]===r; });
  }
  function movesFrom(cur){
    return KN.map(function(d){ return [cur[0]+d[0], cur[1]+d[1]]; })
      .filter(function(q){ return q[0]>=0 && q[0]<8 && q[1]>=0 && q[1]<8 && !visited(q[0], q[1]); });
  }

  // ---- timer ----
  function stopTimer(){ if(kt.timer){ clearInterval(kt.timer); kt.timer = null; } }
  function startTimer(){ kt.start = Date.now(); kt.timer = setInterval(tick, 100); }
  function tick(){
    var e = document.getElementById('ktTimer');
    if(!e || document.getElementById('screen-minigames').style.display !== 'block'){ stopTimer(); return; }
    e.textContent = fmt(Date.now() - kt.start);
  }
  function resetRun(){
    stopTimer();
    kt.path = []; kt.start = 0; kt.ms = 0; kt.done = false; kt.over = false; kt.msg = '';
  }

  // ---- page ----
  window.renderMinigames = function(){
    showScreen('minigames');
    resetRun();
    document.getElementById('screen-minigames').innerHTML = '<div id="ktGame"></div><div id="ktBoard"></div>';
    draw();
    loadBoard();
  };

  function draw(){
    var el = document.getElementById('ktGame');
    if(!el) return;
    var p = kt.path;
    var cur = p[p.length-1];
    var ended = kt.done || kt.over;
    var legal = (cur && !ended) ? movesFrom(cur) : [];

    var b = '<div class="board">';
    for(var r=7; r>=0; r--){
      for(var f=0; f<8; f++){
        var idx = p.findIndex(function(q){ return q[0]===f && q[1]===r; });
        var isCur = !!cur && cur[0]===f && cur[1]===r;
        var cls = 'sq ' + (((f+r)%2===1) ? 'light' : 'dark');
        if(isCur) cls += ' from';
        else if(idx >= 0) cls += ' last visited-n';
        if(legal.some(function(q){ return q[0]===f && q[1]===r; })) cls += ' dest';
        var inner = isCur ? '<span class="kt-knight">&#9822;&#xFE0E;</span>' : (idx >= 0 ? (idx+1) : '');
        b += '<div class="' + cls + '" data-f="' + f + '" data-r="' + r + '">' + inner + '</div>';
      }
    }
    b += '</div>';

    var msg = kt.done ? (kt.msg || 'All 64 squares visited!')
      : kt.over ? 'No moves left! ' + (kt.msg || 'Restart to try again.')
      : !p.length ? 'Click any square to place your knight. The timer starts on your first move.'
      : 'Visit as many squares as you can, each only once, using knight moves.';

    el.innerHTML =
      '<div class="card">' +
        '<h2>Knight\'s tour</h2>' +
        '<p class="desc">Cover as many squares as you can before you run out of moves. More squares wins; ties go to the faster time. No undo!</p>' +
        '<div class="board-wrap">' + b +
          '<div class="panel">' +
            '<div class="kt-time" id="ktTimer">' + (ended ? fmt(kt.ms) : '0:00.0') + '</div>' +
            '<div class="announce ' + (kt.done ? '' : 'empty') + '">' + p.length + '/64 squares</div>' +
            '<div class="status-msg">' + msg + '<br>Your best: ' + fmtBest(kt.best) + '</div>' +
            '<div class="game-actions" style="border-top:none;margin-top:0;padding-top:0;">' +
              '<button class="secondary" id="ktReset"' + (p.length ? '' : ' disabled') + '>Restart</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    el.querySelectorAll('[data-f]').forEach(function(c){
      c.onclick = function(){ click(+c.dataset.f, +c.dataset.r); };
    });
    document.getElementById('ktReset').onclick = function(){ resetRun(); draw(); };
  }

  function click(f, r){
    if(kt.done || kt.over) return;
    var cur = kt.path[kt.path.length-1];
    if(cur && !movesFrom(cur).some(function(q){ return q[0]===f && q[1]===r; })) return;
    if(!kt.path.length) startTimer();
    kt.path.push([f, r]);

    if(kt.path.length === 64){
      kt.ms = Date.now() - kt.start;
      stopTimer();
      kt.done = true;
      playWinSound();
      saveRun();
    } else if(!movesFrom([f, r]).length){
      // no squares left to jump to: the run is over, stop the clock
      kt.ms = Date.now() - kt.start;
      stopTimer();
      kt.over = true;
      playLossSound();
      saveRun();
    } else {
      playMoveSound();
    }
    draw();
  }

  // ---- saving + leaderboard ----
  async function saveRun(){
    var run = {sq: kt.path.length, ms: kt.ms};
    if(!better(run, kt.best)){
      kt.msg = 'Run: ' + run.sq + '/64 in ' + fmt(run.ms) + '. Your best is still ' + fmtBest(kt.best) + '.';
      draw();
      return;
    }
    try{
      await db.ref('hb/ktLeaderboard/' + ME.username).set(run);
      kt.best = run;
      kt.msg = 'New personal best: ' + run.sq + '/64 in ' + fmt(run.ms) + '!';
    }catch(e){
      console.error(e);
      kt.msg = "Run: " + run.sq + "/64, but it couldn't be saved (check the Firebase rule).";
    }
    draw();
    loadBoard();
  }

  async function loadBoard(){
    var box = document.getElementById('ktBoard');
    if(!box) return;
    box.innerHTML = '<div class="card"><h2>Top knights</h2><p class="desc">Loading...</p></div>';
    var html;
    try{
      var snap = await db.ref('hb/ktLeaderboard').once('value');
      var users = snap.exists() ? snap.val() : {};
      var rows = Object.keys(users)
        .map(function(u){ return {u:u, sq:users[u].sq, ms:users[u].ms}; })
        .filter(function(x){ return typeof x.sq === 'number' && typeof x.ms === 'number'; });
      var mine = rows.find(function(x){ return x.u === ME.username; });
      if(mine) kt.best = {sq:mine.sq, ms:mine.ms};
      rows.sort(function(a,b){ return (b.sq - a.sq) || (a.ms - b.ms); });
      rows = rows.slice(0, 10);
      html = rows.length
        ? rows.map(function(x, i){
            return '<div class="seat"><span class="who">#' + (i+1) + ' ' + esc(x.u) + (x.u===ME.username ? ' (you)' : '') +
                   '</span><span class="taken">' + x.sq + '/64 &middot; ' + fmt(x.ms) + '</span></div>';
          }).join('')
        : '<p class="desc">No runs yet. Be the first!</p>';
    }catch(e){
      console.error(e);
      html = '<p class="desc">Could not load the leaderboard right now.</p>';
    }
    box = document.getElementById('ktBoard');
    if(box) box.innerHTML = '<div class="card"><h2>Top knights</h2><p class="desc">Most squares covered, then fastest time.</p>' + html + '</div>';
    if(document.getElementById('ktGame')) draw();
  }
})();
</script>

<script>
(function(){
  var lobbyVariant = 'hb';            // 'hb' = Hand & Brain (default), 'standard' = normal chess
  var customTC = {min:10, inc:0};
  var rematchVariant = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function isCustomTC(){ return /^c\d+\+\d+$/.test(selectedTC); }
  function lbPrefix(v){ return (v || lobbyVariant) === 'standard' ? 'hb:leaderboardStd:' : 'hb:leaderboard:'; }

  // Pressing "Play" in the nav always lands on Hand & Brain
  document.getElementById('navbar').addEventListener('click', function(e){
    var a = e.target.closest('[data-nav]');
    if(a && a.dataset.nav === 'play') lobbyVariant = 'hb';
  }, true);

  // ---- custom time controls like "c10+5" ----
  var origGetTC = window.getTC;
  window.getTC = function(key){
    var m = /^c(\d+)\+(\d+)$/.exec(key || '');
    if(m) return {key:key, label:m[1]+'+'+m[2], initial:(+m[1])*60, increment:+m[2]};
    return origGetTC(key);
  };

  // ---- standard games reuse the random-button game, with the piece pre-announced as "any" ----
  var origKset = window.kset;
  window.kset = function(key, value, shared){
    if(shared !== false && typeof key === 'string' && key.indexOf('hb:game:') === 0 &&
       value && typeof value === 'object' && value.status === 'active'){
      if(value.variant === 'standard' && !value.announced) value.announced = 'std';
      else if(rematchVariant && value.variant === undefined){ value.variant = rematchVariant; value.announced = 'std'; }
    }
    return origKset(key, value, shared);
  };
  var origAllowed = window.allowedFromSquares;
  window.allowedFromSquares = function(chess, announced){
    if(announced === 'std') return chess.moves({verbose:true});
    return origAllowed(chess, announced);
  };
  var origDraw = window.drawGame;
  window.drawGame = function(){
    origDraw();
    var g = gameState;
    if(!g || g.variant !== 'standard') return;
    var a = document.querySelector('#screen-game .announce');
    if(a) a.style.display = 'none';
    document.querySelectorAll('#screen-game .status-msg').forEach(function(e){
      if(e.textContent.indexOf('Click a highlighted') === 0) e.textContent = 'Your move: click a piece, then a square.';
    });
  };
  var origAccept = window.acceptRematch;
  window.acceptRematch = async function(){
    rematchVariant = gameState ? gameState.variant : null;
    try{ await origAccept(); } finally { rematchVariant = null; }
  };

  // ---- separate Standard rating ----
  var origSettle = window.settleMyRating;
  window.settleMyRating = async function(g){
    if(!g || g.variant !== 'standard') return origSettle(g);
    if(g.mode !== 'random' || g.status !== 'finished' || !g.ratingSnapshot) return;
    var gid = currentGameId, me = myRole(g);
    if(!me) return;
    var side = me.side;
    if(myRatingChangeCache[gid] || settlingGames[gid]) return;
    if(g.ratingApplied && g.ratingApplied[side]) return;
    settlingGames[gid] = true;
    var myStart = side === 'w' ? g.ratingSnapshot.white : g.ratingSnapshot.black;
    var oppStart = side === 'w' ? g.ratingSnapshot.black : g.ratingSnapshot.white;
    var change = computeEloChange(myStart, oppStart, scoreForSide(g.winner, side));
    var path = 'hb:leaderboardStd:' + ME.username;
    var prof = (await kget(path, true)) || {rating:myStart, games:0};
    var newRating = prof.rating + change;
    myRatingChangeCache[gid] = {change:change, newRating:newRating};
    await kset(path, {rating:newRating, games:prof.games + 1}, true);
    await db.ref(dbPath('hb:game:' + gid + '/ratingApplied/' + side)).set(true);
    if(gameState && currentGameId === gid) drawGame();

  window.takeSeat = async function(code, seatKey){
    var game = await kget('hb:game:' + code, true);
    if(!game || game.status === 'active' || game.seats[seatKey]) return;
    Object.keys(game.seats).forEach(function(k){ if(game.seats[k] === ME.username) game.seats[k] = ''; });

    if(allSeatsFilled(game)){
      game.status = 'active';
      if(game.mode === 'random'){
        var p = lbPrefix(game.variant === 'standard' ? 'standard' : 'hb');

        game.ratingSnapshot = {white:wp.rating, black:bp.rating};

  // ---- create room (friends) ----

  // ---- quick match ----

    var now = serverNow();
    var cand = Object.keys(q).find(function(u){
      return u !== ME.username && !q[u].gameId && q[u].tc === selectedTC && (q[u].variant || 'hb') === v && (now - q[u].joinedAt) < 60000;
    });
    if(cand){
      var code = genCode(), iAmWhite = Math.random() < 0.5;
      var mp = (await kget(lbp + ME.username, true)) || {rating:1200, games:0};
      var op = (await kget(lbp + cand, true)) || {rating:1200, games:0};
      var game = {
        mode:'random', status:'active', fen:new Chess().fen(), turn:'w', announced:std ? 'std' : null,
        moveLog:[], winner:null, drawOffer:'', clock:freshClock(selectedTC),
        seats: iAmWhite ? {white:ME.username, black:cand} : {white:cand, black:ME.username},
        ratingSnapshot: iAmWhite ? {white:mp.rating, black:op.rating} : {white:op.rating, black:mp.rating}
      };
      if(std) game.variant = 'standard';
      await kset('hb:game:' + code, game, true);

      enterGameScreen(code);
    } else {

          enterGameScreen(gid);

  // ---- the new Play lobby ----
  window.renderLobby = function(){

    currentGameId = null;

      return '<div class="tcbtn ' + (selectedTC === t.key ? 'active' : '') + '" data-tc="' + t.key + '">' + t.label + '</div>';
    }).join('') + '<div class="tcbtn ' + (custom ? 'active' : '') + '" data-tc="custom">Custom</div>';
    var cbox = custom
      ? '<div class="row" style="margin-bottom:16px;"><input type="number" id="cMin" min="1" max="180" value="' + customTC.min + '"><span class="hint">min +</span><input type="number" id="cInc" min="0" max="60" value="' + customTC.inc + '"><span class="hint">sec per move</span></div>'
      : '';
    var modes = std ? '' :

  // ---- recording win/loss/draw counters when a game you played finishes ----

    var prof = r[0], stats = r[3] || {}, kt = r[4];

    if(own && !prof){

      : '<div class="pf-bio">' + (prof && prof.bio ? esc(prof.bio) : '<span class="hint">No bio yet.</span>') + '</div>';

             (s.w||0) + 'W &middot; ' + (s.l||0) + 'L &middot; ' + (s.d||0) + 'D</span></div>';

    var ktText = (kt && typeof kt.sq === 'number') ? kt.sq + '/64 in ' + fmtMs(kt.ms) : 'No runs yet';

  <!-- ===== PAWNIAC STEP 6: ABANDONMENT HANDLING (paste this whole block right before </body>, below step 5) ===== -->
<style>
.ab-box{margin-bottom:14px;}
.ab-box b{font-family:monospace;}

<script>
(function(){
  // ---------- settings ----------
  var FIRST_MOVE_MS      = 30000;            // each side's first move (Lichess uses 30s)
  var FIRST_MOVE_MS_TEAM = 60000;            // team games need more time to coordinate
  var IDLE_MS            = 24*3600*1000;     // no-clock games: side to move forfeits after 24h of nothing
  var GRACE_MS     = 8000;   // opponent must be gone this long before the box even appears (ignores blips)
  var BACK_HOLD_MS = 5000;   // ...and must be back this long before the countdown is forgotten
  function firstMoveMs(g){ return g && g.mode === 'team' ? FIRST_MOVE_MS_TEAM : FIRST_MOVE_MS; }

  // How long a player must be gone before the opponent may claim. Mirrors the figures Lichess
  // players report: 40s blitz and faster, 80s rapid, 120s slower / no clock.
  function claimDelayMs(c){
    if(!c || !(c.initialSec > 0)) return 120000;
    var est = c.initialSec + 40 * (c.incrementSec || 0);
    return est <= 480 ? 40000 : (est <= 1500 ? 80000 : 120000);
  }

  // ---------- 1. stamp every game with when it last changed ----------
  // moveAt = server time of activation / the last move. Used by the first-move abort and the idle forfeit.
  var prevKset = window.kset;
  window.kset = function(key, value, shared){
    if(shared !== false && typeof key === 'string' && key.indexOf('hb:game:') === 0 && value && typeof value === 'object'){
      var n = (value.moveLog || []).length;
      if(value.status === 'active' && (value.moveCount !== n || !value.moveAt)){
        value.moveCount = n;
        value.moveAt = serverNow();
      }
    }
    return prevKset(key, value, shared);
  };

  // ---------- 2. aborted games never touch ratings or records ----------
  var prevSettle = window.settleMyRating;
  window.settleMyRating = function(g){
    if(g && g.winner === 'abort') return Promise.resolve();
    return prevSettle(g);
  };
  var prevScore = window.scoreForSide;
  window.scoreForSide = function(w, s){ return w === 'abort' ? 'abort' : prevScore(w, s); };
  var prevElo = window.computeEloChange;
  window.computeEloChange = function(a, b, sc){ return sc === 'abort' ? 0 : prevElo(a, b, sc); };

  // ---------- 3. atomically end a game (so two clients can't clash) ----------
  function endGame(gid, mutate){
    return db.ref(dbPath('hb:game:' + gid)).transaction(function(cur){
      if(!cur) return cur;
      if(cur.status !== 'active') return;          // already over: leave it alone
      if(mutate(cur) === false) return;            // mutate can veto
      return cur;
    }).catch(function(e){ console.error('endGame failed', e); });
  }
  function markAborted(c, note){
    var sa = {};
    Object.keys(c.seats || {}).forEach(function(k){ if(c.seats[k]) sa[c.seats[k]] = true; });
    c.status = 'finished'; c.winner = 'abort'; c.statusNote = note; c.statsApplied = sa; c.drawOffer = '';
  }
  function abortGame(){
    if(!confirm('Abort this game? No rating change for either player.')) return;
    endGame(currentGameId, function(c){
      if((c.moveLog || []).length >= 2) return false;
      markAborted(c, 'game aborted');
    });
  }

  // ---------- 4. presence: "is this player actually looking at the game?" ----------
  var PRES = {gid:null, names:[], loaded:false, meRef:null, listRef:null, listCb:null, connRef:null, connCb:null, absentSince:null, backSince:null, stuckNow:false};

  function attach(gid){
    PRES.gid = gid; PRES.names = []; PRES.loaded = false; PRES.absentSince = null; PRES.backSince = null; PRES.stuckNow = false;
    var meRef = db.ref('hb/presence/' + gid + '/' + ME.username);
    PRES.meRef = meRef;
    PRES.listRef = db.ref('hb/presence/' + gid);
    PRES.listCb = PRES.listRef.on('value', function(s){
      PRES.names = s.exists() ? Object.keys(s.val()) : [];
      PRES.loaded = true;
    });
    // (re)announce ourselves every time the connection comes up; the server clears it when it drops
    PRES.connRef = db.ref('.info/connected');
    PRES.connCb = PRES.connRef.on('value', function(s){
      if(s.val() === true && PRES.meRef === meRef){
        meRef.onDisconnect().remove().then(function(){ if(PRES.meRef === meRef) meRef.set(true); }).catch(function(){});
      }
    });
  }
  function detach(){
    if(!PRES.gid) return;
    try{
      PRES.listRef.off('value', PRES.listCb);
      PRES.connRef.off('value', PRES.connCb);
      PRES.meRef.onDisconnect().cancel();
      PRES.meRef.remove();
    }catch(e){}
    PRES.gid = null; PRES.names = []; PRES.loaded = false; PRES.meRef = null; PRES.absentSince = null; PRES.backSince = null; PRES.stuckNow = false;
  }

  // Is the opponent side unable to play right now? (empty seat counts as absent)
  function sideStuck(g, opp, names){
    function absent(n){ return !n || names.indexOf(n) < 0; }
    var s = g.seats || {};
    if(g.mode === 'team'){
      var brain = opp === 'w' ? s.whiteBrain : s.blackBrain;
      var hand  = opp === 'w' ? s.whiteHand  : s.blackHand;
      if(absent(brain) && absent(hand)) return true;
      var needed = g.announced ? hand : brain;          // whoever must act next on that side
      return g.turn === opp && absent(needed);
    }
    return absent(opp === 'w' ? s.white : s.black);
  }

  function updateAbsence(){
    var g = gameState;
    if(!g || g.status !== 'active' || !ME || !myRole(g) || !PRES.loaded || PRES.gid !== currentGameId ||
       PRES.names.indexOf(ME.username) < 0){            // if WE look offline, never show a claim
      PRES.absentSince = null; PRES.backSince = null; PRES.stuckNow = false; return;
    }
    var opp = myRole(g).side === 'w' ? 'b' : 'w';
    var stuck = sideStuck(g, opp, PRES.names), now = Date.now();
    PRES.stuckNow = stuck;
    if(stuck){
      PRES.backSince = null;
      if(!PRES.absentSince) PRES.absentSince = now;
    } else if(PRES.absentSince){
      // they reappeared: only forget the countdown if they stay for a few seconds (a flaky connection
      // blinking on and off must not keep restarting it)
      if(!PRES.backSince) PRES.backSince = now;
      else if(now - PRES.backSince >= BACK_HOLD_MS){ PRES.absentSince = null; PRES.backSince = null; }
    }
  }

  // ---------- 5. the "opponent left" box ----------
  function paintAbandon(){
    var g = gameState;
    var box = document.getElementById('abBox');
    var panel = document.querySelector('#screen-game .panel');
    var show = g && g.status === 'active' && PRES.absentSince && PRES.stuckNow &&
               (Date.now() - PRES.absentSince) >= GRACE_MS && panel &&
               document.getElementById('screen-game').style.display === 'block';
    if(!show){ if(box) box.remove(); return; }

    // build the box once; every later call only changes its text / button visibility
    if(!box || !box.querySelector('#abMsg')){
      if(box) box.remove();
      box = document.createElement('div');
      box.id = 'abBox';
      box.className = 'draw-offer ab-box';
      box.innerHTML =
        '<div id="abMsg"></div>' +
        '<div class="draw-offer-btns" id="abBtns" style="display:none;"><button id="abWin">Claim victory</button><button class="secondary" id="abDraw">Call a draw</button></div>' +
        '<div class="hint" id="abHint" style="margin-top:8px;display:none;">Or keep waiting - the game carries on if they come back.</div>';
      panel.insertBefore(box, panel.firstChild);
      document.getElementById('abWin').onclick = function(){ claim('win'); };
      document.getElementById('abDraw').onclick = function(){ claim('draw'); };
    }
    var msg = document.getElementById('abMsg'), btns = document.getElementById('abBtns'), hint = document.getElementById('abHint');
    var n = (g.moveLog || []).length, text, showBtns = false;
    if(n < 2){
      var left = Math.max(0, Math.ceil((firstMoveMs(g) - (serverNow() - (g.moveAt || serverNow()))) / 1000));
      text = "Your opponent isn't connected. If the game doesn't get going, it is aborted in " + left + "s (no rating change). You can also abort it yourself.";
    } else {
      var wait = claimDelayMs(g.clock) - (Date.now() - PRES.absentSince);
      if(wait > 0){
        text = 'Your opponent left the game. You can claim the result in ' + Math.ceil(wait/1000) + 's. They may still come back.';
      } else {
        text = 'Your opponent left the game.';
        showBtns = true;
      }
    }
    msg.textContent = text;
    btns.style.display = showBtns ? 'flex' : 'none';
    hint.style.display = showBtns ? 'block' : 'none';
  }

  async function claim(kind){
    var gid = currentGameId;
    var g = await kget('hb:game:' + gid, true);
    if(!g || g.status !== 'active') return;
    var me = myRole(g); if(!me) return;
    // re-check with fresh data: they might have just come back
    var snap = await db.ref('hb/presence/' + gid).once('value');
    var names = snap.exists() ? Object.keys(snap.val()) : [];
    var opp = me.side === 'w' ? 'b' : 'w';
    if(!sideStuck(g, opp, names)){ alert('Your opponent is back - the game goes on.'); return; }
    var winner = kind === 'win' ? me.side : 'draw';
    var note = kind === 'win' ? 'won - opponent abandoned the game' : 'draw - claimed after opponent left';
    await endGame(gid, function(c){
      c.status = 'finished'; c.winner = winner; c.statusNote = note; c.drawOffer = '';
    });
  }

  // ---------- 6. automatic rules, checked on every clock tick ----------
  var busy = false;
  function checkAbandon(){
    var g = gameState;
    if(busy || !g || g.status !== 'active' || !g.moveAt || !myRole(g)) return;
    var n = (g.moveLog || []).length, idle = serverNow() - g.moveAt, gid = currentGameId;
    var hasClock = g.clock && g.clock.initialSec > 0;

    if(n < 2 && idle > firstMoveMs(g)){
      busy = true;
      var who = g.turn === 'w' ? 'White' : 'Black';
      endGame(gid, function(c){
        if((c.moveLog || []).length >= 2 || serverNow() - (c.moveAt || 0) <= firstMoveMs(c)) return false;
        markAborted(c, 'game aborted - ' + who + ' did not move in time');
      }).then(function(){ setTimeout(function(){ busy = false; }, 3000); });
    } else if(n >= 2 && !hasClock && idle > IDLE_MS){
      busy = true;
      endGame(gid, function(c){
        if((c.clock && c.clock.initialSec > 0) || serverNow() - (c.moveAt || 0) <= IDLE_MS) return false;
        c.status = 'finished';
        c.winner = c.turn === 'w' ? 'b' : 'w';
        c.statusNote = 'won - opponent abandoned (no move for 24h)';
        c.drawOffer = '';
      }).then(function(){ setTimeout(function(){ busy = false; }, 3000); });
    }
  }
  var prevTick = window.clockTick;
  window.clockTick = function(){ checkAbandon(); return prevTick(); };

  // ---------- 7. presence heartbeat loop ----------
  setInterval(function(){
    try{
      var g = gameState;
      var onGame = document.getElementById('screen-game').style.display === 'block';
      var want = (ME && g && onGame && g.status === 'active' && currentGameId && myRole(g)) ? currentGameId : null;
      if(want !== PRES.gid){ detach(); if(want) attach(want); }
      updateAbsence();
    }catch(e){ console.error('presence tick failed', e); }
    try{ paintAbandon(); }catch(e){ console.error('paintAbandon failed', e); }
  }, 1000);

  // ---------- 8. game screen touch-ups ----------
  var prevDraw = window.drawGame;
  window.drawGame = function(){
    prevDraw();
    var g = gameState; if(!g) return;
    var me = myRole(g);
    if(g.status === 'finished' && g.winner === 'abort'){
      var b = document.querySelector('#screen-game .result-banner');
      if(b){
        if(b.firstChild && b.firstChild.nodeType === 3) b.firstChild.nodeValue = 'Game aborted';
        b.querySelectorAll('.rc').forEach(function(d){ if(/^Updating rating/.test(d.textContent)) d.remove(); });
      }
    }
    // before both sides have moved: "Abort" replaces Offer draw / Resign (same as Lichess)
    if(g.status === 'active' && me && (g.moveLog || []).length < 2){
      var acts = document.querySelector('#screen-game .game-actions');
      if(acts && !document.getElementById('btnAbort')){
        var o = document.getElementById('btnOfferDraw'), r = document.getElementById('btnResign');
        if(o) o.style.display = 'none';
        if(r) r.style.display = 'none';
        var a = document.createElement('button');
        a.className = 'secondary danger'; a.id = 'btnAbort'; a.textContent = 'Abort game';
        a.onclick = abortGame;
        acts.appendChild(a);
      }
    }
    paintAbandon();
  };

  // ---------- 9. waiting rooms: a closed tab must not hold a seat forever ----------
  var seatArm = null;   // {code, key, ref}
  function disarmSeat(){
    if(seatArm){ try{ seatArm.ref.onDisconnect().cancel(); }catch(e){} seatArm = null; }
  }
  async function freeSeatNow(){
    if(!seatArm) return;
    var a = seatArm; disarmSeat();
    try{
      var st = await db.ref(dbPath('hb:game:' + a.code + '/status')).once('value');
      var cur = await db.ref(dbPath('hb:game:' + a.code + '/seats/' + a.key)).once('value');
      if(st.val() === 'waiting' && ME && cur.val() === ME.username){
        await db.ref(dbPath('hb:game:' + a.code + '/seats/' + a.key)).set('');
      }
    }catch(e){ console.error(e); }
  }
  var prevDW = window.drawWaiting;
  window.drawWaiting = function(code, game){
    prevDW(code, game);
    var mine = null;
    Object.keys(game.seats || {}).forEach(function(k){ if(game.seats[k] === ME.username) mine = k; });
    if(!mine){ disarmSeat(); return; }
    if(!seatArm || seatArm.code !== code || seatArm.key !== mine){
      disarmSeat();
      var ref = db.ref(dbPath('hb:game:' + code + '/seats/' + mine));
      ref.onDisconnect().set('');        // server clears the seat if we vanish while the room is still waiting
      seatArm = {code:code, key:mine, ref:ref};
    }
  };
  var curScreen = null, prevShow = window.showScreen;
  window.showScreen = function(n){
    var leaving = curScreen === 'waiting' && n !== 'waiting';
    curScreen = n;
    if(leaving){ if(n === 'game') disarmSeat(); else freeSeatNow(); }   // game started -> keep the seat
    prevShow(n);
  };
  var prevLogout = window.logout;
  window.logout = async function(){ await freeSeatNow(); return prevLogout(); };

  // ---------- 10. quick-match queue: closing the tab removes you from it ----------
  var prevQuick = window.quickMatch;
  window.quickMatch = async function(){
    await prevQuick();
    try{ db.ref('hb/queue/random/' + ME.username).onDisconnect().remove(); }catch(e){}
  };

  // ---------- 11. coming back later settles games you walked away from ----------
  // Without this, walking away from a losing game would dodge the rating loss.
  var resumed = {};
  function unsettled(g, me){
    var ratingPending = g.mode === 'random' && g.ratingSnapshot && !(g.ratingApplied && g.ratingApplied[me.side]);
    var statsPending = !(g.statsApplied && g.statsApplied[ME.username]);
    return ratingPending || statsPending;
  }
  var prevAfter = window.afterAuth;
  window.afterAuth = async function(){
    var invite = (new URLSearchParams(location.search).get('room') || '');
    if(!invite){
      try{
        var last = await kget('hb:lastgame', false);
        if(last && last.gameId && !resumed[last.gameId] && (Date.now() - last.savedAt) < 7*86400000){
          var g = await kget('hb:game:' + last.gameId, true);
          var me = g && myRole(g);
          if(me){
            // active games (however old) re-open so a lapsed clock / idle rule can finish them;
            // finished ones re-open once so your rating + record get applied
            if(g.status === 'active' || (g.status === 'finished' && g.winner !== 'abort' && unsettled(g, me))){
              resumed[last.gameId] = true;
              currentGameId = last.gameId;
              enterGameScreen(last.gameId);
              return;
            }
          }
        }
      }catch(e){ console.error(e); }
    }
    return prevAfter();
  };
})();
</script>

<style>
/* ---- toggle switch ---- */
.switch{position:relative;width:42px;height:24px;flex-shrink:0;display:inline-block;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch span{position:absolute;top:0;left:0;right:0;bottom:0;background:#cfc8b6;border-radius:24px;cursor:pointer;transition:background .15s;}
.switch span::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;}
.switch input:checked + span{background:#1f6f5c;}
.switch input:checked + span::before{transform:translateX(18px);}
[data-theme=dark] .switch span{background:#4a463b;}
[data-theme=dark] .switch input:checked + span{background:#1f6f5c;}

/* ---- settings rows ---- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #efe9db;}

.set-label{font-size:13.5px;font-weight:600;}
.set-ctl{display:flex;align-items:center;gap:10px;}
.set-play{padding:5px 10px;font-size:11px;}

[data-theme=dark] .set-row{border-bottom-color:#34312a;}

body.no-dots #screen-game .sq.dest::after{display:none;}
body.no-last #screen-game .sq.light.last:not(.from){background:#f0d9b5;}
body.no-last #screen-game .sq.dark.last:not(.from){background:#b58863;}

/* ---- username dropdown ---- */
#userbox{position:relative;}
.menu-trigger{cursor:pointer;user-select:none;}
.menu-trigger:hover{color:#1f6f5c;}
.menu-trigger .caret{font-size:10px;opacity:.7;}
.user-menu{display:none;position:absolute;right:0;top:100%;margin-top:6px;min-width:150px;background:#fffdf9;border:1px solid #e4ddcf;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:50;text-align:left;overflow:hidden;}
.um-item{padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;}
